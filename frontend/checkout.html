
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - MyShop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        /* Navbar */
        nav {
            background: #222;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff9800;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .container > h2 {
            margin-bottom: 25px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        /* Form */
        .checkout-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .checkout-form h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #ff9800;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Payment */
        .payment-section {
            margin-top: 30px;
        }

        .payment-option {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .payment-option label {
            cursor: pointer;
            margin-left: 8px;
        }

        /* Order Summary */
        .summary {
            background: white;
            padding: 25px;
            border-radius: 10px;
            height: fit-content;
        }

        .summary h2 {
            margin-bottom: 20px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .product-name {
            flex: 1;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Place Order */
        .place-order-btn {
            width: 100%;
            padding: 15px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .place-order-btn:hover {
            background: #e68900;
        }

        /* Back button */
        .back-cart {
            display: inline-block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }

        .back-cart:hover {
            color: #ff9800;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 15px 5%;
            }

            nav a {
                margin-left: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h1>MyShop</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>

    <!-- Checkout -->
    <div class="container">

        <h2>Checkout</h2>

        <div class="checkout-layout">

            <!-- Customer Information -->
            <div class="checkout-form">

                <h2>Shipping Information</h2>

                <form id="checkoutForm">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="firstName">First Name</label>

                            <input
                                type="text"
                                id="firstName"
                                placeholder="Enter first name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name</label>

                            <input
                                type="text"
                                id="lastName"
                                placeholder="Enter last name"
                                required
                            >
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@gmail.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>

                        <textarea
                            id="address"
                            placeholder="Enter your complete address"
                            required
                        ></textarea>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="city">City</label>

                            <input
                                type="text"
                                id="city"
                                placeholder="Enter city"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="state">State</label>

                            <input
                                type="text"
                                id="state"
                                placeholder="Enter state"
                                required
                            >
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="pincode">PIN Code</label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="Enter PIN code"
                            maxlength="6"
                            required
                        >
                    </div>

                    <!-- Payment -->
                    <div class="payment-section">

                        <h2>Payment Method</h2>

                        <div class="payment-option">
                            <input
                                type="radio"
                                id="cod"
                                name="payment"
                                value="cod"
                                checked
                            >

                            <label for="cod">
                                Cash on Delivery
                            </label>
                        </div>

                        <div class="payment-option">
                            <input
                                type="radio"
                                id="card"
                                name="payment"
                                value="card"
                            >

                            <label for="card">
                                Credit / Debit Card
                            </label>
                        </div>

                        <div class="payment-option">
                            <input
                                type="radio"
                                id="upi"
                                name="payment"
                                value="upi"
                            >

                            <label for="upi">
                                UPI
                            </label>
                        </div>

                    </div>

                    <button
                        type="submit"
                        class="place-order-btn"
                    >
                        Place Order
                    </button>

                </form>

                <a href="cart.html" class="back-cart">
                    ← Back to Cart
                </a>

            </div>

            <!-- Order Summary -->
            <div class="summary">

                <h2>Your Order</h2>

                <div class="product">
                    <span class="product-name">
                        Wireless Headphones × 1
                    </span>

                    <span>₹1,499</span>
                </div>

                <div class="product">
                    <span class="product-name">
                        Smart Watch × 1
                    </span>

                    <span>₹2,999</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹4,498</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>₹100</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span>₹4,598</span>
                </div>

            </div>

        </div>

    </div>

    <script>
        const checkoutForm = document.getElementById("checkoutForm");

        checkoutForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const paymentMethod =
                document.querySelector(
                    'input[name="payment"]:checked'
                ).value;

            alert(
                "Order placed successfully!\\n" +
                "Payment Method: " +
                paymentMethod.toUpperCase()
            );

            // Later we will send this information
            // to our Node.js + Express backend.
        });
    </script>

</body>
</html>
