```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        /* Navbar */
        nav {
            background-color: #222;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff9800;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .container h2 {
            margin-bottom: 25px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        /* Cart items */
        .cart-items {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .product-info p {
            color: #777;
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            color: #222;
        }

        /* Quantity */
        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .quantity button:hover {
            background: #ff9800;
        }

        .quantity span {
            font-weight: bold;
        }

        /* Remove button */
        .remove-btn {
            border: none;
            background: #e53935;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #c62828;
        }

        /* Summary */
        .summary {
            background: white;
            padding: 25px;
            border-radius: 10px;
            height: fit-content;
        }

        .summary h2 {
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: #ff9800;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        .checkout-btn:hover {
            background: #e68900;
        }

        /* Empty cart */
        .empty-cart {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            nav {
                padding: 15px 5%;
            }

            nav a {
                margin-left: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h1>MyShop</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>

    <!-- Cart -->
    <div class="container">

        <h2>Shopping Cart</h2>

        <div class="cart-layout">

            <!-- Cart Items -->
            <div class="cart-items">

                <!-- Product 1 -->
                <div class="cart-item">

                    <img src="https://via.placeholder.com/100" alt="Product">

                    <div class="product-info">
                        <h3>Wireless Headphones</h3>
                        <p>High quality wireless headphones</p>
                        <span class="price">₹1,499</span>
                    </div>

                    <div class="quantity">
                        <button onclick="decreaseQuantity(this)">−</button>
                        <span>1</span>
                        <button onclick="increaseQuantity(this)">+</button>
                    </div>

                    <button class="remove-btn" onclick="removeItem(this)">
                        Remove
                    </button>

                </div>

                <!-- Product 2 -->
                <div class="cart-item">

                    <img src="https://via.placeholder.com/100" alt="Product">

                    <div class="product-info">
                        <h3>Smart Watch</h3>
                        <p>Fitness and health tracking watch</p>
                        <span class="price">₹2,999</span>
                    </div>

                    <div class="quantity">
                        <button onclick="decreaseQuantity(this)">−</button>
                        <span>1</span>
                        <button onclick="increaseQuantity(this)">+</button>
                    </div>

                    <button class="remove-btn" onclick="removeItem(this)">
                        Remove
                    </button>

                </div>

            </div>

            <!-- Order Summary -->
            <div class="summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹4,498</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>₹100</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span>₹4,598</span>
                </div>

                <button class="checkout-btn" onclick="checkout()">
                    Proceed to Checkout
                </button>

            </div>

        </div>

    </div>

    <script>
        function increaseQuantity(button) {
            const quantity = button.parentElement.querySelector("span");

            let value = parseInt(quantity.textContent);

            value++;

            quantity.textContent = value;
        }

        function decreaseQuantity(button) {
            const quantity = button.parentElement.querySelector("span");

            let value = parseInt(quantity.textContent);

            if (value > 1) {
                value--;
                quantity.textContent = value;
            }
        }

        function removeItem(button) {
            const item = button.parentElement;

            item.remove();
        }

        function checkout() {
            alert("Proceeding to checkout...");
        }
    </script>

</body>
</html>
